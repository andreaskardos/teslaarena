name: Docker image

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: teslaarena:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name arena -p 8000:8000 teslaarena:test
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/rooms > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q "Tesla Arena"
          curl -fsS http://127.0.0.1:8000/api/rooms | grep -qx "\[\]"
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"time_limit_seconds": 180}' http://127.0.0.1:8000/api/rooms | grep -q room_id
          for attempt in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' arena)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' arena | grep -qx healthy
          [ "$(docker exec arena id -u)" = 10001 ]
          docker logs arena

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/develop' }}
            # Release tags like v0.1 or v1.2.3 publish 0.1 or 1.2.3.
            type=match,pattern=v(.*),group=1
            type=sha,format=short

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
